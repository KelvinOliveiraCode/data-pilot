[project]
name = "data-pilot"
version = "0.1.0"
description = "Data Pilot - painel de vendas em Python que conversa: pandas + Streamlit/Plotly + agente com tool-calling via OpenRouter (Python calcula, a IA so explica)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.0",
    "streamlit>=1.40",
    "plotly>=5.0",
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[project.scripts]
data-pilot = "data_pilot.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]
ignore = ["B008"]
